name: 更新去广告规则

on:
  schedule:
    # 每天 22:00 CST (14:00 UTC) 运行
    - cron: "0 14 * * *"
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 拉取并转换规则
        run: python3 update.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add egern/advertising.yaml
          git diff --cached --quiet || git commit -m "chore: 更新去广告规则 $(date -u +%Y-%m-%d)"
          git push
